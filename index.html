<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOGOR STUDIO CODING v30.0 - ULTIMATE EDITION</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg: #050505; --panel: #111111; --accent: #00e5ff;
            --text: #e0e0e0; --danger: #ff1744; --success: #00e676;
            --border: #222222; --input-bg: #000; --warning: #ffea00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg); color: var(--text);
            height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden;
        }

        header {
            background: var(--panel); padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
            border-bottom: 2px solid var(--accent); z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,229,255,0.1);
        }

        .action-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .action-row::-webkit-scrollbar { display: none; }

        .search-container { display: flex; flex-direction: column; gap: 5px; }
        .search-bar { display: flex; gap: 5px; width: 100%; align-items: center; }
        .logo-text { font-weight: 900; font-size: 14px; color: var(--accent); white-space: nowrap; margin-right: 5px; letter-spacing: 1px; }

        .smart-input {
            flex: 1; background: var(--input-bg); border: 1px solid var(--border);
            color: var(--accent); padding: 8px 12px; font-size: 12px; border-radius: 6px; outline: none;
        }

        .replace-bar { display: none; gap: 5px; padding: 5px 0; animation: slideDown 0.3s forwards; }
        @keyframes slideDown { from { opacity:0; transform: translateY(-5px); } to { opacity:1; transform: translateY(0); } }

        .main-editor { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: #000; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; }
        
        .box { display: flex; flex-direction: column; background: var(--bg); min-height: 250px; border: 1px solid var(--border); transition: 0.2s; position: relative; }
        .box.match { border: 2px solid var(--success) !important; box-shadow: inset 0 0 10px rgba(0, 230, 118, 0.1); }
        .box.active-lang { border: 2px solid var(--accent) !important; z-index: 10; }

        .box-header { 
            padding: 8px 12px; font-size: 11px; font-weight: bold; 
            background: var(--panel); color: var(--accent); 
            display: flex; justify-content: space-between; align-items: center;
        }

        .header-btns { display: flex; gap: 4px; }
        .btn-mini { font-size: 8px; color: #fff; padding: 3px 7px; border-radius: 3px; border: none; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .bg-copy { background: #333; }
        .bg-del { background: var(--danger); }

        textarea {
            flex: 1; border: none; background: transparent; color: #a9dc76;
            padding: 12px; font-size: 13px; outline: none; resize: none; font-family: 'Consolas', monospace;
            line-height: 1.6; tab-size: 4; width: 100%;
        }

        .output-pane { height: 40vh; background: #fff; border-top: 3px solid var(--accent); position: relative; display: flex; flex-direction: column; }
        .output-pane.fullscreen { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 999999 !important; border: none !important; }
        
        .tab-bar { display: flex; background: #111; border-bottom: 1px solid #222; }
        .tab-btn { padding: 10px 20px; font-size: 10px; color: #888; border: none; background: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: #1a1a1a; }

        #viewer { flex: 1; width: 100%; height: 100%; border: none; background: #fff; }
        #console-out { 
            flex: 1; display: none; background: #000; color: #00ff00; 
            padding: 15px; font-family: 'Consolas', monospace; font-size: 12px; 
            overflow-y: auto; white-space: pre-wrap;
        }

        .preview-controls { position: absolute; top: 45px; right: 10px; z-index: 10000; display: flex; gap: 5px; }
        .btn-fs-small { background: rgba(0, 229, 255, 0.9); color: #000; border: none; padding: 6px 12px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        #close-fs { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000001; display: none; background: var(--danger); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 0 15px rgba(255,23,68,0.5); }

        .btn { border: none; padding: 10px 14px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; white-space: nowrap; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .btn:active { transform: scale(0.92); opacity: 0.8; }
        .btn-accent { background: var(--accent); color: #000; }
        .btn-success { background: var(--success); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-apk { background: #ff9800; color: #000; }
        .btn-file { background: #9c27b0; color: #fff; }
        .btn-warning { background: var(--warning); color: #000; }

        .side-menu { position: fixed; top: 0; right: 0; width: 100%; height: 100%; background: var(--panel); z-index: 9999; display: none; flex-direction: column; padding: 20px; }
        .card { background: #000; padding: 15px; border-radius: 8px; border: 1px solid var(--border); border-left: 4px solid var(--accent); margin-bottom: 12px; transition: 0.2s; }
        .card:hover { border-color: var(--accent); }
        .card-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

        @media (min-width: 768px) { .grid-container { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body>

<header>
    <div class="action-row">
        <button class="btn btn-danger" onclick="clearEditor()">🗑️ RESET</button>
        <button class="btn btn-accent" onclick="exportFullJSON()">📥 EXPORT JSON</button>
        <label class="btn btn-accent">📤 IMPORT JSON <input type="file" hidden accept=".json" onchange="importFullJSON(this)"></label>
        <label class="btn btn-file">📁 FILE TO CODE <input type="file" hidden id="input-file-code" onchange="handleFileInsertion(this)"></label>
        <button class="btn btn-success" onclick="buildProject('html')">🔥 HTML</button>
        <button class="btn btn-success" onclick="buildProject('zip')">📦 ZIP</button>
        <button class="btn btn-apk" onclick="buildAPKBridge()">🤖 BUILD APK</button>
    </div>

    <div class="search-container">
        <div class="search-bar">
            <span class="logo-text">GOGOR STUDIO</span>
            <input type="text" id="smart-search" class="smart-input" placeholder="Cari kode atau bahasa..." oninput="ultraSearch()">
            <button class="btn btn-accent" onclick="toggleReplace()">🔄 REPLACE</button>
            <button class="btn btn-accent" onclick="toggleSidebar()">📁 MANAGER</button>
            <button class="btn btn-success" onclick="masterRun()">▶️ RUN</button>
        </div>
        <div class="replace-bar" id="replace-bar">
            <input type="text" id="replace-text" class="smart-input" placeholder="Ganti dengan...">
            <button class="btn btn-danger" onclick="executeReplace()">REPLACE ALL</button>
        </div>
    </div>
</header>

<div class="main-editor">
    <div class="grid-container" id="editor-grid"></div>
</div>

<button id="close-fs" onclick="toggleFullscreen()">❌ KELUAR FULLSCREEN</button>

<div class="output-pane" id="preview-section">
    <div class="tab-bar">
        <button class="tab-btn active" id="tab-web" onclick="switchTab('web')">WEB PREVIEW</button>
        <button class="tab-btn" id="tab-console" onclick="switchTab('console')">CONSOLE OUTPUT</button>
    </div>
    <div class="preview-controls">
        <button class="btn-fs-small" onclick="toggleFullscreen()">🖥️ FULL SCREEN</button>
    </div>
    <iframe id="viewer"></iframe>
    <div id="console-out">Menunggu eksekusi kode...</div>
</div>

<div class="side-menu" id="side-menu">
    <h1 style="color:var(--accent); margin-bottom:20px; letter-spacing:2px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; font-weight: 900;">GOGOR MANAGER</h1>
    <div id="list-proyek" style="flex:1; overflow-y:auto; padding-right: 5px;"></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
        <button class="btn btn-success" style="padding:15px" onclick="saveNew()">💾 SIMPAN / UPDATE</button>
        <button class="btn btn-danger" onclick="eraseDB()">ERASE DATABASE</button>
        <button class="btn btn-accent" style="grid-column: span 2;" onclick="toggleSidebar()">KEMBALI KE EDITOR</button>
    </div>
</div>

<script>
    const languages = [
        {id:'html', name:'HTML5', type:'web'}, {id:'css', name:'CSS3', type:'web'}, 
        {id:'js', name:'JS', type:'web'}, {id:'py', name:'PYTHON', type:'cloud', version:'3.10.0', api:'python'},
        {id:'cpp', name:'C++', type:'cloud', version:'10.2.0', api:'cpp'}, {id:'java', name:'JAVA', type:'cloud', version:'15.0.2', api:'java'},
        {id:'sql', name:'SQL', type:'cloud', version:'sqlite3', api:'sqlite3'}, {id:'cs', name:'C#', type:'cloud', version:'5.0.1', api:'csharp'}
    ];
    const DB_NAME = "GOGOR_STABLE_V30";
    let activeId = null;
    let lastActiveLang = 'html';

    // Build Editors
    const grid = document.getElementById('editor-grid');
    languages.forEach(l => {
        grid.innerHTML += `
            <div class="box" id="box-${l.id}" onclick="setFocus('${l.id}')">
                <div class="box-header">
                    <span>${l.name} ${l.type === 'cloud' ? '<small>☁️</small>' : ''}</span> 
                    <div class="header-btns">
                        <button class="btn-mini bg-copy" onclick="copyCode('${l.id}', event)">SALIN</button>
                        <button class="btn-mini bg-del" onclick="clearSpecific('${l.id}', event)">HAPUS</button>
                    </div>
                </div>
                <textarea id="${l.id}" spellcheck="false" onkeydown="smartInput(event)" oninput="handleTextareaInput('${l.id}')"></textarea>
            </div>`;
    });

    function setFocus(id) {
        lastActiveLang = id;
        document.querySelectorAll('.box').forEach(b => b.classList.remove('active-lang'));
        const activeBox = document.getElementById(`box-${id}`);
        if(activeBox) activeBox.classList.add('active-lang');
    }

    function handleTextareaInput(id) {
        if(id === lastActiveLang) autoRunWeb();
    }

    // --- STRENGTHENED FILE INSERTION ---
    function handleFileInsertion(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        const extension = file.name.split('.').pop().toLowerCase();
        const textExtensions = ['html', 'htm', 'js', 'css', 'txt', 'py', 'cpp', 'java', 'sql', 'cs', 'json', 'php', 'xml'];
        const isTextFile = textExtensions.includes(extension);

        reader.onload = (e) => {
            const data = e.target.result;
            insertToActiveEditor(data, file.name, !isTextFile);
        };

        if (isTextFile) reader.readAsText(file);
        else reader.readAsDataURL(file);
        
        input.value = ''; 
    }

    function insertToActiveEditor(data, fileName, isBase64) {
        const target = document.getElementById(lastActiveLang);
        const start = target.selectionStart;
        const end = target.selectionEnd;
        let snippet = "";

        if (isBase64) {
            if (fileName.match(/\.(jpg|jpeg|png|gif|webp|svg)$/i)) {
                snippet = `\n<img src="${data}" alt="${fileName}">\n`;
            } else if (fileName.match(/\.(mp3|wav|ogg|m4a)$/i)) {
                snippet = `\n<audio controls src="${data}"></audio>\n`;
            } else if (fileName.match(/\.(mp4|webm)$/i)) {
                snippet = `\n<video controls width="100%" src="${data}"></video>\n`;
            } else {
                snippet = `/* File: ${fileName} (Base64) */\nconst data_${fileName.replace(/[^a-zA-Z]/g,'_')} = "${data}";\n`;
            }
        } else {
            const commentStart = (lastActiveLang === 'html') ? `` : `/* START: ${fileName} */`;
            const commentEnd = (lastActiveLang === 'html') ? `` : `/* END: ${fileName} */`;
            snippet = `\n${commentStart}\n${data}\n${commentEnd}\n`;
        }

        const oldVal = target.value;
        target.value = oldVal.substring(0, start) + snippet + oldVal.substring(end);
        
        // Restore Cursor
        const newPos = start + snippet.length;
        target.setSelectionRange(newPos, newPos);
        target.focus();

        alert(`File ${fileName} berhasil digabungkan ke editor ${lastActiveLang.toUpperCase()}`);
        masterRun();
    }

    // --- STRENGTHENED EXPORT/IMPORT ---
    function exportFullJSON() {
        const editors = {};
        languages.forEach(l => editors[l.id] = document.getElementById(l.id).value);
        const backup = { 
            app: "GOGOR_STUDIO",
            session: { activeId, editors }, 
            database: JSON.parse(localStorage.getItem(DB_NAME) || "[]"),
            timestamp: Date.now()
        };
        download(new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'}), `BACKUP_GOGOR_${Date.now()}.json`);
    }

    function importFullJSON(input) {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if (confirm("Peringatan: Seluruh data saat ini akan ditimpa. Lanjutkan?")) {
                    if (data.database) localStorage.setItem(DB_NAME, JSON.stringify(data.database));
                    if (data.session && data.session.editors) {
                        activeId = data.session.activeId;
                        languages.forEach(l => {
                            document.getElementById(l.id).value = data.session.editors[l.id] || "";
                        });
                    }
                    renderProyek(); 
                    masterRun(); 
                    alert("Seluruh Database dan Editor Berhasil Dipulihkan!");
                }
            } catch (err) { alert("File JSON rusak atau tidak valid."); }
        };
        reader.readAsText(file);
        input.value = '';
    }

    // --- MANAGER FEATURES ---
    function renameProyek(id) {
        let db = JSON.parse(localStorage.getItem(DB_NAME) || "[]");
        const idx = db.findIndex(x => x.id === id);
        if (idx !== -1) {
            const newName = prompt("Ganti nama proyek menjadi:", db[idx].name);
            if (newName && newName.trim() !== "") {
                db[idx].name = newName.trim();
                localStorage.setItem(DB_NAME, JSON.stringify(db));
                renderProyek();
            }
        }
    }

    function renderProyek() {
        const db = JSON.parse(localStorage.getItem(DB_NAME) || "[]");
        const list = document.getElementById('list-proyek');
        if(db.length === 0) {
            list.innerHTML = `<p style="text-align:center; color:#555; margin-top:20px;">Belum ada proyek tersimpan.</p>`;
            return;
        }
        list.innerHTML = db.map(p => `
            <div class="card" style="${activeId === p.id ? 'border-color:var(--success); background:#001a00;' : ''}">
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                        <b style="color:var(--accent); font-size:14px;">${p.name}</b><br>
                        <small style="color:#666;">${p.date}</small>
                    </div>
                    ${activeId === p.id ? '<span style="color:var(--success); font-size:9px; font-weight:bold;">SEDANG DIBUKA</span>' : ''}
                </div>
                <div class="card-actions">
                    <button class="btn btn-success" onclick="loadP(${p.id})">MUAT</button>
                    <button class="btn btn-warning" onclick="renameProyek(${p.id})">RENAME</button>
                    <button class="btn btn-danger" onclick="deleteP(${p.id})">HAPUS</button>
                </div>
            </div>`).join('');
    }

    function saveNew() {
        let db = JSON.parse(localStorage.getItem(DB_NAME) || "[]");
        const data = { id: activeId || Date.now(), date: new Date().toLocaleString() };
        
        if(!activeId) {
            const n = prompt("Beri Nama Proyek Baru:");
            if(!n || n.trim() === "") return;
            data.name = n.trim();
        }

        languages.forEach(l => data[l.id] = document.getElementById(l.id).value);

        if(activeId) {
            const i = db.findIndex(x => x.id === activeId);
            data.name = db[i].name;
            db[i] = data;
        } else {
            db.push(data);
            activeId = data.id;
        }

        localStorage.setItem(DB_NAME, JSON.stringify(db));
        alert("Proyek Berhasil Disimpan!");
        renderProyek();
    }

    // --- LOGIC INTI ---
    function smartInput(e) {
        const el = e.target; const s = el.selectionStart; const v = el.value;
        if (e.key === 'Tab') { e.preventDefault(); el.value = v.substring(0, s) + "    " + v.substring(s); el.selectionStart = el.selectionEnd = s + 4; }
        const pairs = { '(': ')', '{': '}', '[': ']', '"': '"', "'": "'" };
        if (pairs[e.key]) { 
            e.preventDefault(); 
            el.value = v.substring(0, s) + e.key + pairs[e.key] + v.substring(s); 
            el.selectionStart = el.selectionEnd = s + 1; 
        }
    }

    function masterRun() {
        const langData = languages.find(l => l.id === lastActiveLang);
        if(langData.type === 'web') { switchTab('web'); runWeb(); } 
        else { switchTab('console'); runCloud(langData); }
    }

    function runWeb() {
        const h = document.getElementById('html').value;
        const c = `<style>body{margin:0;padding:0;}${document.getElementById('css').value}</style>`;
        const j = `<script>try{${document.getElementById('js').value}}catch(e){console.error(e)}<\/script>`;
        const viewer = document.getElementById('viewer');
        const doc = viewer.contentDocument || viewer.contentWindow.document;
        doc.open(); 
        doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">${c}</head><body>${h}${j}</body></html>`); 
        doc.close();
    }

    async function runCloud(lang) {
        const consoleEl = document.getElementById('console-out');
        const code = document.getElementById(lang.id).value;
        if(!code.trim()) return;
        consoleEl.innerHTML = `> Status: Mengirim ke Server Cloud...`;
        try {
            const res = await fetch('https://emkc.org/api/v2/piston/execute', {
                method: 'POST',
                body: JSON.stringify({ language: lang.api, version: lang.version, files: [{ content: code }] })
            });
            const data = await res.json();
            if(data.run) {
                consoleEl.innerHTML = `<span style="color:var(--accent)">[OUT]</span>\n${data.run.output || "Eksekusi Berhasil (Tanpa Output)."}`;
                if(data.run.stderr) consoleEl.innerHTML += `\n\n<span style="color:var(--danger)">[ERR]</span>\n${data.run.stderr}`;
            }
        } catch (e) { consoleEl.innerHTML = `> Koneksi Error: Server cloud tidak menanggapi.`; }
    }

    function switchTab(type) {
        document.getElementById('viewer').style.display = type === 'web' ? 'block' : 'none';
        document.getElementById('console-out').style.display = type === 'console' ? 'block' : 'none';
        document.getElementById('tab-web').classList.toggle('active', type === 'web');
        document.getElementById('tab-console').classList.toggle('active', type === 'console');
    }

    function ultraSearch() {
        const q = document.getElementById('smart-search').value.toLowerCase();
        languages.forEach(l => {
            const box = document.getElementById(`box-${l.id}`);
            const content = document.getElementById(l.id).value.toLowerCase();
            const match = l.name.toLowerCase().includes(q) || content.includes(q);
            box.style.display = (match || q === "") ? "flex" : "none";
            box.classList.toggle('match', q !== "" && match);
        });
    }

    function toggleReplace() {
        const bar = document.getElementById('replace-bar');
        bar.style.display = (bar.style.display === 'flex') ? 'none' : 'flex';
    }

    function executeReplace() {
        const f = document.getElementById('smart-search').value;
        const r = document.getElementById('replace-text').value;
        if(!f) return alert("Tentukan teks yang ingin dicari!");
        languages.forEach(l => {
            const el = document.getElementById(l.id);
            el.value = el.value.split(f).join(r);
        });
        masterRun();
    }

    function toggleFullscreen() {
        const isFS = document.getElementById('preview-section').classList.toggle('fullscreen');
        document.getElementById('close-fs').style.display = isFS ? 'block' : 'none';
    }

    function loadP(id) {
        const db = JSON.parse(localStorage.getItem(DB_NAME) || "[]");
        const p = db.find(x => x.id === id);
        if(p) {
            languages.forEach(l => document.getElementById(l.id).value = p[l.id] || "");
            activeId = id; 
            toggleSidebar(); 
            masterRun();
        }
    }

    function deleteP(id) {
        if(confirm("Hapus proyek ini secara permanen?")) {
            let db = JSON.parse(localStorage.getItem(DB_NAME) || "[]").filter(x => x.id !== id);
            localStorage.setItem(DB_NAME, JSON.stringify(db));
            if(activeId === id) activeId = null;
            renderProyek();
        }
    }

    async function buildAPKBridge() {
        const zip = new JSZip();
        const full = `<!DOCTYPE html><html><head><style>${document.getElementById('css').value}</style></head><body>${document.getElementById('html').value}<script>${document.getElementById('js').value}<\/script></body></html>`;
        zip.file("app/src/main/assets/index.html", full);
        download(await zip.generateAsync({type:"blob"}), "SOURCE_APK_GOGOR.zip");
    }

    async function buildProject(type) {
        const h = document.getElementById('html').value, c = document.getElementById('css').value, j = document.getElementById('js').value;
        if(type === 'html') {
            const full = `<!DOCTYPE html><html><head><style>${c}</style></head><body>${h}<script>${j}<\/script></body></html>`;
            download(new Blob([full], {type:'text/html'}), "index.html");
        } else {
            const zip = new JSZip(); zip.file("index.html", h); zip.file("style.css", c); zip.file("script.js", j);
            download(await zip.generateAsync({type:"blob"}), "project_gogor.zip");
        }
    }

    function eraseDB() { if(confirm("PERINGATAN: Hapus seluruh database proyek? Tindakan ini tidak bisa dibatalkan.")) { localStorage.removeItem(DB_NAME); location.reload(); } }
    function download(b, n) { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = n; a.click(); }
    function toggleSidebar() { const s = document.getElementById('side-menu'); s.style.display = s.style.display==='flex'?'none':'flex'; if(s.style.display==='flex') renderProyek(); }
    function autoRunWeb() { if(languages.find(l=>l.id===lastActiveLang).type==='web'){ clearTimeout(window.t); window.t = setTimeout(runWeb, 1200); } }
    
    function copyCode(id, e) { 
        e.stopPropagation(); 
        const area = document.getElementById(id); 
        area.select(); 
        document.execCommand('copy'); 
        alert("Kode " + id.toUpperCase() + " berhasil disalin!"); 
    }
    
    function clearSpecific(id, e) { 
        e.stopPropagation(); 
        if(confirm("Bersihkan editor " + id.toUpperCase() + "?")) { 
            document.getElementById(id).value = ""; 
            masterRun(); 
        } 
    }
    
    function clearEditor() { 
        if(confirm("Kosongkan seluruh editor aktif? (Database tetap aman)")) { 
            languages.forEach(l => document.getElementById(l.id).value = ""); 
            masterRun(); 
            activeId = null; 
        } 
    }

    // Init
    setFocus('html');
    runWeb();
</script>
</body>
