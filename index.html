<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOGOR STUDIO</title>
    <script src="https://cdn.jsdelivr.net/npm/@octokit/rest/dist-octokit-rest.min.js"></script>
    <script>
    // Initialize the GitHub API client
    const octokit = new Octokit({ auth: 'your_personal_access_token' });

    // Function to auto-fill GitHub integration details
    async function autoFillGitHubIntegration() {
        try {
            const { data } = await octokit.rest.users.getAuthenticated();
            document.getElementById('github_username').value = data.login;
            document.getElementById('github_email').value = data.email;
        } catch (error) {
            console.error('Error fetching GitHub user data:', error);
        }
    }

    // Call the function on window load
    window.onload = autoFillGitHubIntegration;
    </script>
</head>
<body>
    <h1>Welcome to GOGOR STUDIO</h1>
    <form>
        <label for="github_username">GitHub Username:</label>
        <input type="text" id="github_username" readonly />
        <br>
        <label for="github_email">GitHub Email:</label>
        <input type="email" id="github_email" readonly />
        <br>
        <input type="submit" value="Submit" />
    </form>
</body>
</html>
