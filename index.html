<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOGOR STUDIO v30.0 - FILE CONVERTER</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg: #050505; --panel: #111111; --accent: #00e5ff;
            --text: #e0e0e0; --danger: #ff1744; --success: #00e676;
            --border: #222222; --input-bg: #000; --warning: #ffea00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg); color: var(--text);
            height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden;
        }

        header {
            background: var(--panel); padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
            border-bottom: 2px solid var(--accent); z-index: 1000;
        }

        .action-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .action-row::-webkit-scrollbar { display: none; }

        .search-container { display: flex; flex-direction: column; gap: 5px; }
        .search-bar { display: flex; gap: 5px; width: 100%; align-items: center; }
        .logo-text { font-weight: 900; font-size: 14px; color: var(--accent); white-space: nowrap; margin-right: 5px; letter-spacing: 1px; }

        .smart-input {
            flex: 1; background: var(--input-bg); border: 1px solid var(--border);
            color: var(--accent); padding: 8px 12px; font-size: 12px; border-radius: 6px; outline: none;
        }

        .main-editor { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: #000; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; }
        
        .box { display: flex; flex-direction: column; background: var(--bg); min-height: 280px; border: 1px solid var(--border); transition: 0.2s; }
        .box.active-lang { border: 2px solid var(--accent) !important; z-index: 10; }

        .box-header { 
            padding: 8px 12px; font-size: 10px; font-weight: bold; 
            background: var(--panel); color: var(--accent); 
            display: flex; justify-content: space-between; align-items: center;
        }

        .header-btns { display: flex; gap: 4px; }
        .btn-mini { font-size: 9px; color: #fff; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .bg-paste { background: var(--success); color: #000; }
        .bg-copy { background: #444; }
        .bg-del { background: var(--danger); }

        textarea {
            flex: 1; border: none; background: transparent; color: #a9dc76;
            padding: 12px; font-size: 13px; outline: none; resize: none; font-family: 'Consolas', monospace;
            line-height: 1.6; width: 100%;
        }

        .output-pane { height: 35vh; background: #fff; border-top: 3px solid var(--accent); position: relative; display: flex; flex-direction: column; }
        .output-pane.fullscreen { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 999999 !important; }
        
        .tab-bar { display: flex; background: #111; }
        .tab-btn { padding: 10px 20px; font-size: 10px; color: #888; border: none; background: none; cursor: pointer; font-weight: bold; }
        .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: #1a1a1a; }

        #viewer { flex: 1; width: 100%; height: 100%; border: none; background: #fff; }
        #console-out { flex: 1; display: none; background: #000; color: #00ff00; padding: 15px; font-family: 'Consolas', monospace; font-size: 12px; overflow-y: auto; white-space: pre-wrap; }

        .btn { border: none; padding: 10px 14px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; white-space: nowrap; transition: 0.2s; }
        .btn-accent { background: var(--accent); color: #000; }
        .btn-success { background: var(--success); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-save-main { background: #ffea00; color: #000; }

        .side-menu { position: fixed; top: 0; right: 0; width: 100%; height: 100%; background: var(--panel); z-index: 9999; display: none; flex-direction: column; padding: 20px; }
        #list-proyek { flex: 1; overflow-y: auto; }
        .card { background: #000; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; }
        .card-actions { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }

        #close-fs { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000001; display: none; background: var(--danger); color: #fff; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 11px; }

        @media (min-width: 768px) { .grid-container { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body>

<header>
    <div class="action-row">
        <button class="btn btn-danger" onclick="clearEditor()">🗑️ RESET</button>
        <button class="btn btn-accent" onclick="exportFullJSON()">📥 EXPORT SEMUA</button>
        <label class="btn btn-accent">📤 IMPORT JSON <input type="file" id="import-input" hidden accept=".json" onchange="importFullJSON(this)"></label>
        <label class="btn btn-success" style="background:#9c27b0; color:white;">📁 ADD ANY FILE <input type="file" id="universal-file" hidden onchange="processFileToCode(this)"></label>
        <button class="btn btn-success" onclick="buildProject('html')">🔥 HTML</button>
        <button class="btn btn-success" onclick="buildProject('zip')" style="background:#00bcd4">📦 ZIP</button>
        <button class="btn btn-danger" onclick="buildProject('exe')" style="background:#607d8b">🖥️ EXE (HTA)</button>
        <button class="btn btn-accent" style="background:#ff9800; color:black;" onclick="buildAPKBridge()">🤖 BUILD APK</button>
        <button class="btn btn-save-main" onclick="saveNew()">💾 SIMPAN</button>
    </div>

    <div class="search-container">
        <div class="search-bar">
            <span class="logo-text">GOGOR STUDIO</span>
            <input type="text" id="smart-search" class="smart-input" placeholder="Cari kode/bahasa..." oninput="ultraSearch()">
            <button class="btn btn-accent" onclick="toggleSidebar()">📁 MANAGER</button>
            <button class="btn btn-success" onclick="masterRun()">▶️ RUN</button>
        </div>
    </div>
</header>

<div class="main-editor">
    <div class="grid-container" id="editor-grid"></div>
</div>

<button id="close-fs" onclick="toggleFullscreen()">❌ KELUAR FULLSCREEN</button>

<div class="output-pane" id="preview-section">
    <div class="tab-bar">
        <button class="tab-btn active" id="tab-web" onclick="switchTab('web')">WEB PREVIEW</button>
        <button class="tab-btn" id="tab-console" onclick="switchTab('console')">CONSOLE</button>
        <button class="btn" style="margin-left:auto; background:none; color:var(--accent)" onclick="toggleFullscreen()">[ FS ]</button>
    </div>
    <iframe id="viewer"></iframe>
    <div id="console-out">Sistem Siap...</div>
</div>

<div class="side-menu" id="side-menu">
    <h1 style="color:var(--accent); margin-bottom:20px;">DATABASE MANAGER</h1>
    <div id="list-proyek"></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
        <button class="btn btn-success" style="padding:15px" onclick="saveNew()">💾 SIMPAN BARU</button>
        <button class="btn btn-danger" onclick="eraseDB()">FORMAT DB</button>
        <button class="btn btn-accent" style="grid-column: span 2;" onclick="toggleSidebar()">TUTUP</button>
    </div>
</div>

<script>
    const languages = [
        {id:'html', name:'HTML5', type:'web'}, {id:'css', name:'CSS3', type:'web'}, {id:'js', name:'JS', type:'web'},
        {id:'ts', name:'TS', type:'cloud', api:'typescript', version:'5.0.3'},
        {id:'php', name:'PHP', type:'cloud', api:'php', version:'8.2.3'},
        {id:'py', name:'PYTHON', type:'cloud', api:'python', version:'3.10.0'},
        {id:'go', name:'GO', type:'cloud', api:'go', version:'1.16.2'},
        {id:'rust', name:'RUST', type:'cloud', api:'rust', version:'1.68.2'},
        {id:'cpp', name:'C++', type:'cloud', api:'cpp', version:'10.2.0'},
        {id:'java', name:'JAVA', type:'cloud', api:'java', version:'15.0.2'},
        {id:'kt', name:'KOTLIN', type:'cloud', api:'kotlin', version:'1.8.20'},
        {id:'dart', name:'DART', type:'cloud', api:'dart', version:'2.19.6'},
        {id:'swift', name:'SWIFT', type:'cloud', api:'swift', version:'5.3.3'},
        {id:'rb', name:'RUBY', type:'cloud', api:'ruby', version:'3.0.1'},
        {id:'r', name:'R', type:'cloud', api:'r', version:'4.2.2'},
        {id:'sql', name:'SQL', type:'cloud', api:'sqlite3', version:'3.36.0'}
    ];

    const DB_NAME = "GOGOR_STABLE_DB";
    let db, activeId = null, lastActiveLang = 'html';

    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = (e) => { e.target.result.createObjectStore("projects", { keyPath: "id" }); };
    request.onsuccess = (e) => { db = e.target.result; renderProyek(); };

    const grid = document.getElementById('editor-grid');
    languages.forEach(l => {
        grid.innerHTML += `
            <div class="box" id="box-${l.id}" onclick="setFocus('${l.id}')">
                <div class="box-header">
                    <span>${l.name}</span>
                    <div class="header-btns">
                        <button class="btn-mini bg-paste" onclick="pasteTo('${l.id}', event)">Tempel</button>
                        <button class="btn-mini bg-copy" onclick="copyCode('${l.id}', event)">Salin</button>
                        <button class="btn-mini bg-del" onclick="clearSpecific('${l.id}', event)">X</button>
                    </div>
                </div>
                <textarea id="${l.id}" spellcheck="false" onkeydown="smartInput(event)" oninput="autoRunWeb()"></textarea>
            </div>`;
    });

    function setFocus(id) {
        lastActiveLang = id;
        document.querySelectorAll('.box').forEach(b => b.classList.remove('active-lang'));
        document.getElementById(`box-${id}`).classList.add('active-lang');
    }

    function processFileToCode(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        const area = document.getElementById(lastActiveLang);
        if (file.type.startsWith('image/')) {
            reader.onload = (e) => {
                const base64 = e.target.result;
                area.value += (lastActiveLang === 'html') ? `\n<img src="${base64}" style="max-width:100%;">\n` : `\n/* ${file.name} */\nconst img_data = "${base64}";\n`;
                masterRun();
            };
            reader.readAsDataURL(file);
        } else {
            reader.onload = (e) => { area.value += `\n/* From: ${file.name} */\n${e.target.result}\n`; masterRun(); };
            reader.readAsText(file);
        }
        input.value = "";
    }

    // --- SISTEM BUILD (HTML, ZIP, EXE/HTA) ---
    async function buildProject(type) {
        const h = document.getElementById('html').value;
        const c = document.getElementById('css').value;
        const j = document.getElementById('js').value;
        const fullContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${c}</style></head><body>${h}<script>${j}<\/script></body></html>`;

        if (type === 'html') {
            download(new Blob([fullContent], {type:'text/html'}), "index.html");
        } 
        else if (type === 'zip') {
            const zip = new JSZip();
            zip.file("index.html", fullContent);
            zip.file("style.css", c);
            zip.file("script.js", j);
            const blob = await zip.generateAsync({type:"blob"});
            download(blob, "GOGOR_PROJECT.zip");
        } 
        else if (type === 'exe') {
            const htaTag = `<hta:application id="gogorApp" border="thin" caption="yes" showintaskbar="yes" singleinstance="yes" sysmenu="yes" windowstate="normal">`;
            const htaContent = `<!DOCTYPE html><html><head><meta charset="UTF-8">${htaTag}<style>${c}</style></head><body>${h}<script>${j}<\/script></body></html>`;
            download(new Blob([htaContent], {type:'application/hta'}), "GOGOR_APP.hta");
            alert("File .hta disimpan. Bisa dijalankan langsung di Windows.");
        }
    }

    async function buildAPKBridge() {
        const zip = new JSZip();
        zip.file("index.html", `<html><style>${document.getElementById('css').value}</style><body>${document.getElementById('html').value}<script>${document.getElementById('js').value}<\/script></body></html>`);
        download(await zip.generateAsync({type:"blob"}), "GOGOR_APK.zip");
    }

    // --- DATABASE & FITUR RENAME ---
    async function saveNew() {
        let name = activeId ? null : prompt("Nama Proyek:");
        if (!activeId && !name) return;
        const tx = db.transaction("projects", "readwrite");
        const store = tx.objectStore("projects");
        const data = { id: activeId || Date.now(), name: name || "Project", date: new Date().toLocaleString() };
        if(activeId) {
            const existing = await new Promise(r => store.get(activeId).onsuccess = (e) => r(e.target.result));
            data.name = existing.name;
        }
        languages.forEach(l => data[l.id] = document.getElementById(l.id).value);
        store.put(data);
        tx.oncomplete = () => { activeId = data.id; alert("Project Saved!"); renderProyek(); };
    }

    function renderProyek() {
        const store = db.transaction("projects").objectStore("projects");
        store.getAll().onsuccess = (e) => {
            document.getElementById('list-proyek').innerHTML = e.target.result.map(p => `
                <div class="card" style="${activeId === p.id ? 'border-color:var(--accent)' : ''}">
                    <b>${p.name}</b><br><small>${p.date}</small>
                    <div class="card-actions">
                        <button class="btn btn-success" onclick="loadP(${p.id})">LOAD</button>
                        <button class="btn btn-warning" onclick="renameP(${p.id})">RENAME</button>
                        <button class="btn btn-danger" onclick="deleteP(${p.id})">DEL</button>
                    </div>
                </div>`).join('');
        };
    }

    function renameP(id) {
        const store = db.transaction("projects", "readwrite").objectStore("projects");
        store.get(id).onsuccess = (e) => {
            const data = e.target.result;
            const newName = prompt("Masukkan nama baru:", data.name);
            if (newName && newName !== data.name) {
                data.name = newName;
                store.put(data).onsuccess = () => renderProyek();
            }
        };
    }

    function loadP(id) {
        db.transaction("projects").objectStore("projects").get(id).onsuccess = (e) => {
            const p = e.target.result;
            languages.forEach(l => document.getElementById(l.id).value = p[l.id] || "");
            activeId = id; toggleSidebar(); masterRun();
        };
    }

    function deleteP(id) {
        if(confirm("Hapus proyek ini?")) {
            db.transaction("projects", "readwrite").objectStore("projects").delete(id).onsuccess = () => {
                if(activeId === id) activeId = null;
                renderProyek();
            };
        }
    }

    // --- LOGIKA EDITOR ---
    function masterRun() {
        const lang = languages.find(l => l.id === lastActiveLang);
        if(lang.type === 'web') { switchTab('web'); runWeb(); } 
        else { switchTab('console'); runCloud(lang); }
    }

    function runWeb() {
        const h = document.getElementById('html').value, c = document.getElementById('css').value, j = document.getElementById('js').value;
        const doc = document.getElementById('viewer').contentWindow.document;
        doc.open(); doc.write(`<html><head><style>${c}</style></head><body>${h}<script>try{${j}}catch(e){console.error(e)}<\/script></body></html>`); doc.close();
    }

    async function runCloud(lang) {
        const out = document.getElementById('console-out'); out.innerHTML = "> Compiling...";
        try {
            const res = await fetch('https://emkc.org/api/v2/piston/execute', {
                method: 'POST',
                body: JSON.stringify({ language: lang.api, version: lang.version, files: [{ content: document.getElementById(lang.id).value }] })
            });
            const data = await res.json();
            out.innerHTML = data.run.output || "Done.";
        } catch (e) { out.innerHTML = "API Error."; }
    }

    function exportFullJSON() {
        db.transaction("projects").objectStore("projects").getAll().onsuccess = (e) => {
            download(new Blob([JSON.stringify(e.target.result, null, 2)], {type:'application/json'}), "GOGOR_BACKUP.json");
        };
    }

    function importFullJSON(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = JSON.parse(e.target.result);
            const tx = db.transaction("projects", "readwrite");
            data.forEach(p => tx.objectStore("projects").put(p));
            tx.oncomplete = () => location.reload();
        };
        reader.readAsText(input.files[0]);
    }

    function switchTab(t) {
        document.getElementById('viewer').style.display = t === 'web' ? 'block' : 'none';
        document.getElementById('console-out').style.display = t === 'console' ? 'block' : 'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id.includes(t)));
    }
    function toggleFullscreen() { const isFS = document.getElementById('preview-section').classList.toggle('fullscreen'); document.getElementById('close-fs').style.display = isFS ? 'block' : 'none'; }
    function toggleSidebar() { const s = document.getElementById('side-menu'); s.style.display = s.style.display==='flex'?'none':'flex'; if(s.style.display==='flex') renderProyek(); }
    function autoRunWeb() { if(['html','css','js'].includes(lastActiveLang)) { clearTimeout(window.t); window.t = setTimeout(runWeb, 1000); } }
    function smartInput(e) { if (e.key === 'Tab') { e.preventDefault(); const s = e.target.selectionStart; e.target.value = e.target.value.substring(0, s) + "    " + e.target.value.substring(e.target.selectionEnd); e.target.selectionStart = e.target.selectionEnd = s + 4; } }
    function copyCode(id, e) { e.stopPropagation(); document.getElementById(id).select(); document.execCommand('copy'); alert("Copied!"); }
    function clearSpecific(id, e) { e.stopPropagation(); if(confirm("Clear?")) document.getElementById(id).value = ""; }
    function clearEditor() { if(confirm("Reset all?")) { languages.forEach(l => document.getElementById(l.id).value = ""); activeId = null; } }
    function eraseDB() { if(confirm("Format DB?")) { indexedDB.deleteDatabase(DB_NAME); location.reload(); } }
    function download(b, n) { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = n; a.click(); }
    async function pasteTo(id, e) { e.stopPropagation(); try { const t = await navigator.clipboard.readText(); const a = document.getElementById(id); a.value += t; masterRun(); } catch(err) {} }
    function ultraSearch() {
        const q = document.getElementById('smart-search').value.toLowerCase();
        languages.forEach(l => {
            const match = l.name.toLowerCase().includes(q) || document.getElementById(l.id).value.toLowerCase().includes(q);
            document.getElementById(`box-${l.id}`).style.display = match ? "flex" : "none";
        });
    }

    setFocus('html');
</script>
</body>
</html>
